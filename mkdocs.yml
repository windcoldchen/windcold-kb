site_name: Windcold 知識庫
site_description: 基於 Material for MkDocs 與 GitHub Pages 打造的個人技術與知識管理庫
site_author: windcoldchen
site_url: https://windcoldchen.github.io/windcold-kb/

repo_name: windcoldchen/windcold-kb
repo_url: https://github.com/windcoldchen/windcold-kb
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh-Hant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    # 淺色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切換至深色模式

    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切換至淺色模式

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    repo: fontawesome/brands/github
    tag:
      default: material/tag

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - markdown_checklist.extension
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - tags
  - git-committers:
      repository: windcoldchen/windcold-kb
      branch: main
      token: !ENV [MKDOCS_GIT_COMMITTERS_APIKEY, !ENV [GITHUB_TOKEN, ""]]
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      locale: zh
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false
  - git-latest-changes:
      limit_to_docs_dir: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - ai-summary:
      api: chatgpt
      prompt: "請用繁體中文將以下內容總結為 200 字以內的摘要："
  - llmstxt:
      full_output: llms-full.txt
      sections:
        文件與指南:
          - index.md: 知識庫首頁
          - getting-started/*.md: 入門與部署設定
          - notes/*.md: 技術筆記與日常工作流
          - changelog.md: 最新異動紀錄
          - tags.md: 標籤索引
          - about.md: 關於本站
  - redirects:
      redirect_maps: {}
  - autorefs
  - autolinks
  - alias


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/windcoldchen

nav:
  - 首頁: index.md
  - 快速上手:
      - 知識庫設定與部署: getting-started/configuration.md
      - Markdown 語法示範: getting-started/syntax-cheatsheet.md
  - 知識筆記:
      - 範例筆記: notes/example.md
      - 開發工作流: notes/workflow.md
      - Azure Static Web Apps 方案: notes/azure-static-web-apps.md
      - Cloudflare Pages + Access 方案: notes/cloudflare-pages-entra-id.md
      - Self-Hosted GitLab CI/CD 方案: notes/gitlab-ci-cd-deployment.md
      - mkdocs-mcp 使用指南: notes/mkdocs-mcp-guide.md
      - AIOps 智慧可觀測性方案: notes/observability-aiops-architecture.md
      - Pushover 行動推播指南: notes/pushover-guide.md
      - VictoriaMetrics 全家桶架構解析: notes/victoriametrics-ecosystem-guide.md
      - VictoriaMetrics vs OTel 指標採集對比: notes/victoriametrics-vs-opentelemetry-metrics.md
      - OTel vs VictoriaMetrics 全家餐評比: notes/otel-vs-victoriametrics-fullstack.md
      - Prometheus+Loki+Tempo vs VM 全家桶評比: notes/prometheus-loki-tempo-vs-victoriametrics.md
      - OTel + VictoriaMetrics 全家桶實戰指南: notes/otel-victoriametrics-fullstack-guide.md
      - Rancher + RKE2 + Proxmox 私有雲架構: notes/rancher-rke2-proxmox-guide.md
      - 透過 Rancher 部署下游 RKE2 業務叢集: notes/rancher-provision-rke2-cluster.md
      - Grafana Tanka + AWX 資源修剪實戰: notes/tanka-awx-k8s-pruning-guide.md
      - Proxmox + EKS Distro + Rancher 混合雲架構: notes/proxmox-eksd-rancher-guide.md
  - 最新異動: changelog.md
  - 標籤索引: tags.md
  - 關於: about.md
